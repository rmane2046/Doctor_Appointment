# Activated with the profile "oracle":  --spring.profiles.active=oracle
# (in Eclipse: Run Configurations > Arguments > Program arguments)

# ---- 1. Connection URL: use ONE of these, depending on your Oracle version ----
# Oracle XE 18c / 21c / 23c (pluggable database). Service name is usually XEPDB1 (XE 23c: FREEPDB1):
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
# Oracle 11g XE (old, uses SID "XE")  ->  comment the line above and use this one instead:
# spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
# NOTE: Oracle 11g does not support identity columns, so use Oracle 12c or newer.

# ---- 2. The database user you created for this project (see README / steps) ----
spring.datasource.username=docapp
spring.datasource.password=docapp123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ---- 3. JPA: tables are created automatically in the docapp schema ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
