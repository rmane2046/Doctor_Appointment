# ---------- Server ----------
server.port=8080

# ---------- Database (default: in-memory H2, no setup needed) ----------
spring.datasource.url=jdbc:h2:mem:docapp;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:docapp-demo-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000
