# ---------- Server ----------
server.port=8080

# ---------- Database (default: in-memory H2, no setup needed) ----------
# Data is wiped on every restart and re-created by DataSeeder.
# To use MySQL instead, run with:  --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:docapp;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# Secret must be at least 32 characters (256 bits) for HS256.
# In real deployments read it from an environment variable instead of hard-coding it.
app.jwt.secret=${JWT_SECRET:docapp-demo-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-ms=86400000
