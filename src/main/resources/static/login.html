<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DocBook</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="container">
    <div class="card auth-card">
      <h2>Welcome back</h2>
      <p class="page-sub">Log in to book and manage appointments.</p>

      <form id="login-form">
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-block" type="submit" id="submit-btn">Login</button>
      </form>

      <p style="margin-top:14px">New patient? <a href="register.html">Create an account</a></p>

      <div class="hint">
        <strong>Demo accounts</strong><br>
        Patient: <code>patient@docapp.com</code> / <code>Patient@123</code><br>
        Doctor: <code>anjali.sharma@docapp.com</code> / <code>Doctor@123</code><br>
        Admin: <code>admin@docapp.com</code> / <code>Admin@123</code>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    renderHeader();

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const button = document.getElementById('submit-btn');
      button.disabled = true;
      try {
        const data = await api('/auth/login', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          }
        });
        saveAuth(data);

        // ?next=index.html (set when a visitor clicked "Book" while logged out)
        const next = new URLSearchParams(window.location.search).get('next');
        const safeNext = next && /^[a-z\-]+\.html$/.test(next) ? next : null;
        window.location.href = (data.user.role === 'PATIENT' && safeNext) ? safeNext : homeFor(data.user);
      } catch (err) {
        toast(err.message, 'error');
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
